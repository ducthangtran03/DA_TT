<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#cfe8ff;--pink:#ff7aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#cfe8ff}}
:root[data-theme="dark"]{--bg:#000;--ink:#cfe8ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#rain{transition:opacity 1.2s}
#c3{opacity:0;transition:opacity 2.5s;touch-action:none;cursor:grab}
#start,#finale{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px)}
#finale button{font:inherit;color:var(--ink);background:none;border:1px solid var(--ink);border-radius:999px;padding:14px 32px;font-size:18px;cursor:pointer}
#finale button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
#finale{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);pointer-events:none;opacity:0;transition:opacity 2s}
#finale.on{opacity:1}
/* ===== CHUYỂN CẢNH ===== */
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 42%,#fff 0%,#ffd6e3 25%,rgba(255,61,127,.55) 55%,rgba(255,61,127,0) 80%);mix-blend-mode:screen}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%);opacity:.55}
.bar{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height 1.6s cubic-bezier(.6,0,.2,1)}
#barT{top:0}#barB{bottom:0}
body.cine .bar{height:7vh}
body.cine.done .bar{height:0}
#stage{position:fixed;inset:0;will-change:transform,filter}
#finale h1{margin:0 0 18px;font-size:clamp(28px,6vw,52px);font-weight:800;color:#ffd6e3;letter-spacing:.01em;text-shadow:0 0 18px #ff3d7f}
#finale button{pointer-events:auto;font-size:14px;padding:9px 20px;opacity:.6}


/* ===== NÚT EM ĐỒNG Ý (NÚT TRÒN LỚN + LOADING %) ===== */
#accept{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 24px calc(env(safe-area-inset-bottom,0px) + 6vh);pointer-events:none;opacity:0;transform:translateY(30px) scale(.9);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);z-index:5;font-family:"Be Vietnam Pro",system-ui,sans-serif}
#accept.on{opacity:1;transform:none}
#accept.on #yes{pointer-events:auto}
#yes{--p:0;position:relative;width:168px;height:168px;padding:0;border:0;border-radius:50%;cursor:pointer;background:none;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform 1.1s cubic-bezier(.55,0,.9,.35),opacity 1.1s ease}
#yes:focus-visible{outline:2px solid #fff;outline-offset:8px}
#yes .halo{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,127,.55) 0%,rgba(255,61,127,.18) 48%,rgba(255,61,127,0) 70%);animation:halo 1.7s ease-in-out infinite}
#yes .orbit{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);animation:spin 14s linear infinite;overflow:visible}
#yes .orbit circle{fill:none;stroke:rgba(255,179,203,.55);stroke-width:1.4;stroke-dasharray:1 9;stroke-linecap:round}
#yes .orbit .dot{fill:#fff;stroke:none;filter:drop-shadow(0 0 6px #fff)}
#yes .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
#yes .ring circle{fill:none;stroke-width:5;stroke-linecap:round}
#yes .ring .track{stroke:rgba(255,179,203,.22)}
#yes .ring .bar{stroke:url(#rg);stroke-dasharray:502;stroke-dashoffset:502;filter:drop-shadow(0 0 8px #ff7aa8)}
#yes .disc{position:absolute;inset:14px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:radial-gradient(circle at 34% 26%,#ff9bbd 0%,#ff4f8b 42%,#e8135f 100%);
  box-shadow:0 10px 40px rgba(255,31,107,.55),0 0 0 1px rgba(255,255,255,.18),inset 0 3px 0 rgba(255,255,255,.5),inset 0 -14px 30px rgba(120,0,50,.35);
  transition:transform .5s ease;animation:beat 1.7s ease-in-out infinite}
#yes:hover .disc{transform:scale(1.04)}
#yes .disc::after{content:"";position:absolute;top:10%;left:18%;width:44%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));transform:rotate(-24deg);pointer-events:none}
#yes .hi{width:30px;height:30px;fill:#fff;filter:drop-shadow(0 2px 6px rgba(120,0,50,.45));transition:opacity .3s,transform .3s}
#yes .tx{font-weight:600;font-size:17px;letter-spacing:.06em;text-shadow:0 2px 8px rgba(120,0,50,.45);white-space:nowrap}
#yes .pct{position:absolute;font-weight:300;font-size:44px;line-height:1;letter-spacing:-.02em;opacity:0;transform:translateY(-6px);text-shadow:0 2px 12px rgba(120,0,50,.5);transition:opacity .4s}
#yes .pct small{font-size:18px;font-weight:500;margin-left:2px}
#yes.loading{animation:none;pointer-events:none}
#yes.loading .disc{animation:beat .62s ease-in-out infinite}
#yes.loading .hi,#yes.loading .tx{opacity:0;transform:scale(.6)}
#yes.loading .pct{opacity:1}
#yes.loading .orbit{animation-duration:2.2s}
#yes.go{transform:scale(34);opacity:0}
#accept .lb{margin:30px 0 0;font:italic 500 clamp(22px,6vw,28px) "Playfair Display",Georgia,serif;color:#fff2f7;text-shadow:0 0 16px rgba(255,61,127,.9),0 0 40px rgba(255,61,127,.5);transition:opacity .5s}
#accept .sub{margin:10px 0 0;font:300 11px "Be Vietnam Pro",system-ui,sans-serif;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:#ffb3cb;min-height:1em;animation:sub 2.4s ease-in-out infinite}
#accept.fade .lb,#accept.fade .sub{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes halo{0%,100%{transform:scale(1);opacity:.85}15%{transform:scale(1.12);opacity:1}30%{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1)}36%{transform:scale(1.03)}}
@keyframes sub{0%,100%{opacity:.4}50%{opacity:.9}}

/* ===== INTRO: TRÁI TIM TINH VÂN ===== */
#start{overflow:hidden;cursor:pointer;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(ellipse 80% 65% at 50% 36%,rgba(86,10,44,.8) 0%,rgba(20,2,11,.95) 58%,#000 100%);
  transition:opacity 1.2s ease,transform 1.2s ease,filter 1.2s ease}
#start.leaving{opacity:0;transform:scale(1.12);filter:blur(10px)}
#start canvas#ic{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#start .glow{position:absolute;left:50%;top:36%;width:min(110vw,720px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,50,120,.34) 0%,rgba(255,50,120,.1) 38%,rgba(255,50,120,0) 68%);opacity:0;animation:fadeIn 3s 1s forwards,breathe 1.7s 3s ease-in-out infinite}
#start .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;
  padding:0 24px calc(env(safe-area-inset-bottom,0px) + 8vh);pointer-events:none}
#start .stage>*{pointer-events:auto}
#start .eyebrow{position:absolute;top:calc(env(safe-area-inset-top,0px) + 7vh);left:0;right:0;margin:0;font-size:11px;letter-spacing:.55em;padding-left:.55em;text-transform:uppercase;color:#ffb3cb;opacity:0;animation:fadeIn 2s 1.2s forwards}
#start .txt{transition:opacity .5s ease,transform .5s ease}
#start.opening .txt,#start.opening .eyebrow{opacity:0!important;transform:scale(1.05)}
#start h2{margin:0;font-weight:500;font-style:italic;font-family:"Playfair Display",Georgia,"Times New Roman",serif;color:#fff2f7}
#start h2 .ln{display:block}
#start h2 .l1{font-family:"Be Vietnam Pro",system-ui,sans-serif;font-style:normal;font-weight:400;font-size:clamp(12px,3.2vw,15px);letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#ff9fbf;margin-bottom:14px}
#start h2 .l2{font-size:clamp(34px,9.4vw,62px);line-height:1.22;text-shadow:0 0 22px rgba(255,61,127,.75),0 0 60px rgba(255,61,127,.45)}
#start .wd{display:inline-block;white-space:nowrap}
#start .ch{display:inline-block;opacity:0;transform:translateY(.45em) scale(.8);filter:blur(9px);animation:chIn 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(2.9s + var(--i)*.05s)}
#start button{position:relative;overflow:hidden;margin-top:38px;font:inherit;font-size:13px;font-weight:600;letter-spacing:.36em;padding:17px 42px 17px calc(42px + .36em);text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,#ff3d7f,#ff7aa8);border:0;border-radius:999px;cursor:pointer;opacity:0;
  box-shadow:0 0 28px rgba(255,61,127,.65),0 0 70px rgba(255,61,127,.35),inset 0 1px 0 rgba(255,255,255,.45);
  animation:fadeIn 1.2s 4.6s forwards,btnBeat 1.7s 5.8s ease-in-out infinite;transition:filter .3s}
#start button::before{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s 5.4s ease-in-out infinite}
#start button:hover{filter:brightness(1.15)}
#start button:focus-visible{outline:2px solid #fff;outline-offset:4px}
#start .hint{margin:20px 0 0;font-size:11px;font-weight:300;letter-spacing:.12em;color:var(--ink);opacity:0;animation:fadeHint 1.6s 5.4s forwards}
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeHint{to{opacity:.55}}
@keyframes chIn{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}12%{transform:translate(-50%,-50%) scale(1.09)}24%{transform:translate(-50%,-50%) scale(1)}36%{transform:translate(-50%,-50%) scale(1.05)}}
@keyframes btnBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1)}36%{transform:scale(1.03)}}
@keyframes shine{0%,50%{left:-70%}100%{left:140%}}
@media (prefers-reduced-motion:reduce){#start .ch,#start .glow,#start button,#start .hint,#start .eyebrow{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="fx"></canvas>
<canvas id="c3"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div class="bar" id="barT"></div><div class="bar" id="barB"></div>
<audio id="bgm" src="nhac.mp3" loop preload="auto"></audio>
<div id="accept" aria-live="polite">
  <button id="yes" type="button" aria-label="Em đồng ý">
    <span class="halo"></span>
    <svg class="orbit" viewBox="0 0 192 192" aria-hidden="true"><circle cx="96" cy="96" r="94"/><circle class="dot" cx="96" cy="2" r="3.2"/></svg>
    <svg class="ring" viewBox="0 0 168 168" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d7f"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><circle class="track" cx="84" cy="84" r="80"/><circle class="bar" cx="84" cy="84" r="80"/></svg>
    <span class="disc">
      <svg class="hi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5C5 15.2 3 11.6 3 8.6 3 6 5 4.2 7.4 4.2c1.9 0 3.6 1.1 4.6 2.8 1-1.7 2.7-2.8 4.6-2.8C19 4.2 21 6 21 8.6c0 3-2 6.6-9 11.9z"/></svg>
      <span class="tx">Em đồng ý</span>
      <span class="pct"><span id="pctN">0</span><small>%</small></span>
    </span>
  </button>
</div>
<div id="finale"><h1 id="fin"></h1><button id="again" type="button">Xem lại</button></div>
<div id="start">
  <div class="glow"></div>
  <canvas id="ic"></canvas>
  <p class="eyebrow">Một lời nhắn riêng</p>
  <div class="stage"><div class="txt">
    <h2 aria-label="Có một điều anh muốn nói với em"><span class="ln l1" aria-hidden="true"><span class="wd"><span class="ch" style="--i:1">C</span><span class="ch" style="--i:2">ó</span></span> <span class="wd"><span class="ch" style="--i:3">m</span><span class="ch" style="--i:4">ộ</span><span class="ch" style="--i:5">t</span></span> <span class="wd"><span class="ch" style="--i:6">đ</span><span class="ch" style="--i:7">i</span><span class="ch" style="--i:8">ề</span><span class="ch" style="--i:9">u</span></span></span><span class="ln l2" aria-hidden="true"><span class="wd"><span class="ch" style="--i:10">a</span><span class="ch" style="--i:11">n</span><span class="ch" style="--i:12">h</span></span> <span class="wd"><span class="ch" style="--i:13">m</span><span class="ch" style="--i:14">u</span><span class="ch" style="--i:15">ố</span><span class="ch" style="--i:16">n</span></span> <span class="wd"><span class="ch" style="--i:17">n</span><span class="ch" style="--i:18">ó</span><span class="ch" style="--i:19">i</span></span> <span class="wd"><span class="ch" style="--i:20">v</span><span class="ch" style="--i:21">ớ</span><span class="ch" style="--i:22">i</span></span> <span class="wd"><span class="ch" style="--i:23">e</span><span class="ch" style="--i:24">m</span></span></span></h2>
    <button id="go" type="button">Chạm để mở</button>
    <p class="hint">Bật âm thanh để có trải nghiệm trọn vẹn</p>
  </div></div>
</div>
<script>
(function(){
const st=document.getElementById('start'), cv=document.getElementById('ic'); if(!cv) return;
const ctx=cv.getContext('2d');
let W,H,dpr,cx,cy,K,P=[],mx=-9999,my=-9999,exploding=false,te=0;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const t0=performance.now(), off=reduce?9:0;
const PAL=['#ff2d75','#ff4f8b','#ff6a9a','#ff8fb5','#ffb3cb','#ffd6e3','#ffffff'];
const rnd=(a,b)=>a+Math.random()*(b-a);
function heartPt(t){const x=16*Math.pow(Math.sin(t),3), y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return [x,y];}
// bảng độ dài cung để rải điểm đều dọc viền tim
const LUT=(function(){const n=600,c=[0];let px,py;for(let i=0;i<=n;i++){const [x,y]=heartPt(i/n*Math.PI*2);if(i)c.push(c[i-1]+Math.hypot(x-px,y-py));px=x;py=y;}return c;})();
function edgeT(){const L=LUT[LUT.length-1],r=Math.random()*L;let lo=0,hi=LUT.length-1;while(lo<hi){const m=(lo+hi)>>1;if(LUT[m]<r)lo=m+1;else hi=m;}return lo/(LUT.length-1)*Math.PI*2;}
function inHeart(u,v){const a=u*u+v*v-1;return a*a*a-u*u*v*v*v<=0;}
function fillPt(){for(;;){const u=rnd(-1.2,1.2),v=rnd(-1.05,1.3);if(inHeart(u,v))return [u*14,-(v-.125)*13.5];}}
function build(){
  const N=Math.max(1800,Math.min(3200,Math.round(W*H/150)));
  P=[];
  const R=Math.max(W,H)*.72;
  for(let i=0;i<N;i++){
    let tx,ty;
    if(Math.random()<.52){ const [x,y]=heartPt(edgeT()); const j=rnd(.97,1.0); tx=x*j+rnd(-.35,.35); ty=-y-2.5+rnd(-.35,.35); }
    else { [tx,ty]=fillPt(); }
    const arm=i%3, r=Math.pow(Math.random(),.6)*R, ang=r*.011+arm*2.0944+rnd(-.35,.35);
    const rr=Math.random();
    P.push({tx,ty,sx:Math.cos(ang)*r,sy:Math.sin(ang)*r*.8,d:.3+(i/N)*1.4+Math.random()*.4,du:rnd(1.9,2.8),
      sw:rnd(2.2,4.2),ph:Math.random()*6.28,s:rnd(1,2.5)*(rr<.04?1.5:1),c:rr<.07?6:Math.floor(Math.random()*6),
      bloom:Math.random()<.16,ox:0,oy:0,vx:0,vy:0,x:0,y:0,al:rnd(.7,1)});
  }
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2); W=st.clientWidth||innerWidth; H=st.clientHeight||innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2; cy=H*.36; K=Math.min(W*.74/32,H*.32/30,13);
}
const pulse=(x,c,w)=>Math.exp(-Math.pow((x-c)/w,2));
function frame(now){
  if(!st.isConnected) return;
  requestAnimationFrame(frame);
  const t=(now-t0)/1000+off;
  ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
  const ph=((t-3)%1.7+1.7)%1.7/1.7, beat=t>3?pulse(ph,.06,.07)+.6*pulse(ph,.24,.07):0, bs=1+.075*beat;
  const fade=exploding?Math.max(0,1-(now-te)/1200):1;
  if(fade<=0){ctx.globalCompositeOperation='source-over';return;}
  for(const p of P){
    let X,Y,a;
    if(exploding){
      p.x+=p.vx; p.y+=p.vy; p.vx*=.962; p.vy*=.962; X=p.x; Y=p.y; a=p.al*fade;
    } else {
      let e=Math.min(1,Math.max(0,(t-p.d)/p.du)); e=1-Math.pow(1-e,3);
      let rx=p.sx*(1-e)+p.tx*K*bs*e, ry=p.sy*(1-e)+p.ty*K*bs*e;
      const th=(1-e)*(p.sw+t*.18);
      const c=Math.cos(th), s=Math.sin(th);
      X=cx+rx*c-ry*s; Y=cy+rx*s+ry*c;
      X+=Math.sin(t*1.7+p.ph)*.9*e; Y+=Math.cos(t*1.3+p.ph)*.9*e;
      const dx=X-mx, dy=Y-my, d2=dx*dx+dy*dy;
      if(d2<15000){const d=Math.sqrt(d2)||1, f=Math.pow(1-d/122,2)*7; p.ox+=dx/d*f; p.oy+=dy/d*f;}
      p.ox*=.9; p.oy*=.9; X+=p.ox; Y+=p.oy; p.x=X; p.y=Y;
      a=p.al*(.3+.7*e)*(.72+.28*Math.sin(t*3+p.ph))*(1+.35*beat*e);
    }
    ctx.fillStyle=PAL[p.c];
    ctx.globalAlpha=Math.min(1,a);
    ctx.fillRect(X-p.s/2,Y-p.s/2,p.s,p.s);
    if(p.bloom){ctx.globalAlpha=Math.min(1,a)*.16;ctx.beginPath();ctx.arc(X,Y,p.s*3.6,0,6.283);ctx.fill();}
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
window.introExplode=function(){
  if(exploding) return; exploding=true; te=performance.now();
  for(const p of P){
    let dx=p.x-cx, dy=p.y-cy, d=Math.hypot(dx,dy)||1, sp=rnd(7,26)*(1+(1-Math.min(1,d/(K*20)))*.6);
    p.vx=dx/d*sp+rnd(-2,2); p.vy=dy/d*sp+rnd(-2,2);
  }
};
function setPt(e){const r=st.getBoundingClientRect();const q=e.touches?e.touches[0]:e;mx=q.clientX-r.left;my=q.clientY-r.top;}
st.addEventListener('pointermove',setPt); st.addEventListener('pointerdown',setPt);
st.addEventListener('pointerleave',()=>{mx=my=-9999;}); st.addEventListener('pointerup',()=>{if(e_touch())mx=my=-9999;});
function e_touch(){return !matchMedia('(pointer:fine)').matches;}
st.addEventListener('click',e=>{ if(e.target.id!=='go') document.getElementById('go').click(); });
resize(); build(); requestAnimationFrame(frame);
addEventListener('resize',()=>{resize();build();});
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
// ====== SỬA NỘI DUNG Ở ĐÂY ======
const CONFIG = {
  rainWord: "I LOVE YOU ",
  steps: [

function wrapLines(c, lines, maxW){
  const out = [];
  for (const ln of lines){
    let cur = '';
    for (const word of ln.split(' ')){
      const t = cur ? cur + ' ' + word : word;
      if (c.measureText(t).width > maxW && cur){ out.push(cur); cur = word; } else cur = t;
    }
    out.push(cur);
  }
  return out;
}

function textPoints(lines, color){
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const c = o.getContext('2d');
  const size = Math.min(W * .13, H * .14, 110);
  c.font = `800 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  const ls = wrapLines(c, lines, W * .86), lh = size * 1.25;
  ls.forEach((t, i) => c.fillText(t, W / 2, H / 2 + (i - (ls.length - 1) / 2) * lh));
  const gap = Math.max(3, Math.round(size / 20)), data = c.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += gap) for (let x = 0; x < W; x += gap)
    if (data[(y * W + x) * 4 + 3] > 128) pts.push({ x, y, r: Math.max(2, gap * .55), c: color || '#cfe8ff' });
  return pts;
}

// hạt xuất hiện từ nhiều hướng khác nhau mỗi cảnh: 0 trên xuống, 1 hai bên, 2 từ tâm nổ ra, 3 dưới lên, 4 vòng tròn xoáy
function spawnPos(style, tx, ty){
  const cx = W / 2, cy = H / 2;
  switch (style % 5){
    case 1: return { x: Math.random() < .5 ? -30 : W + 30, y: ty + (Math.random() - .5) * H * .6 };
    case 2: return { x: cx + (Math.random() - .5) * 20, y: cy + (Math.random() - .5) * 20 };
    case 3: return { x: tx + (Math.random() - .5) * W * .5, y: H + 30 + Math.random() * H * .3 };
    case 4: { const a = Math.random() * 6.283, R = Math.max(W, H) * .7; return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R }; }
    default: return { x: tx + (Math.random() - .5) * W * .4, y: -20 - Math.random() * H * .3 };
  }
}
function setTargets(pts){
  const live = parts.filter(p => !p.dying);
  pts.sort(() => Math.random() - .5);
  const cx = W / 2, cy = H / 2;
  pts.forEach((pt, i) => {
    let p = live[i];
    if (!p){
      const s = spawnPos(spawnStyle, pt.x, pt.y);
      p = { x: s.x, y: s.y, a: 0, dying: false }; parts.push(p);
    }
    // trễ theo khoảng cách tới tâm → chữ "nở" dần từ giữa ra
    const dist = Math.hypot(pt.x - cx, pt.y - cy) / Math.hypot(cx, cy);
    Object.assign(p, { tx: pt.x, ty: pt.y, r: pt.r, c: pt.c, e: .05 + Math.random() * .06, delay: Math.round(dist * 28 + Math.random() * 8), burst: false, vx: 0, vy: 0, spin: 0 });
  });
  for (let i = pts.length; i < live.length; i++) kill(live[i]);
  spawnStyle++;
}
function kill(p){
  p.dying = true; p.delay = 0;
  const cx = W / 2, cy = H / 2, dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1;
  if (killStyle === 'burst'){          // nổ tung ra ngoài, có xoáy nhẹ
    const sp = 3 + Math.random() * 9;
    p.burst = true; p.vx = dx / d * sp + (-dy / d) * 1.5; p.vy = dy / d * sp + (dx / d) * 1.5 - 1; p.spin = 0;
    p.fade = .014 + Math.random() * .012;
  } else if (killStyle === 'vortex'){  // xoáy hút vào tâm
    p.burst = true; p.vx = -dy / d * 6; p.vy = dx / d * 6; p.spin = .045; p.fade = .02;
  } else {                              // rơi xuống
    p.burst = false; p.tx = p.x + (Math.random() - .5) * 80; p.ty = H + 40; p.e = .025; p.fade = .02;
  }
}
function scatter(){ parts.forEach(p => { if (!p.dying) kill(p); }); }

function fxFrame(){
  pc.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, glow = parts.length < 7000;
  pc.globalCompositeOperation = 'lighter';
  for (const p of parts){
    if (p.delay > 0){ p.delay--; continue; }
    if (p.burst){
      if (p.spin){                       // xoáy quanh tâm
        const dx = p.x - cx, dy = p.y - cy, c = Math.cos(p.spin), s = Math.sin(p.spin);
        p.x = cx + (dx * c - dy * s) * .985; p.y = cy + (dx * s + dy * c) * .985;
      } else { p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy = p.vy * .96 + .05; }
    } else {
      p.x += (p.tx - p.x) * p.e; p.y += (p.ty - p.y) * p.e;
    }
    if (!p.dying){ p.x += (Math.random() - .5) * .5; p.y += (Math.random() - .5) * .5; }
    p.a = p.dying ? p.a - (p.fade || .02) : Math.min(1, p.a + .06);
    if (p.a <= 0) continue;
    pc.globalAlpha = p.a; pc.fillStyle = p.c; pc.fillRect(p.x, p.y, p.r, p.r);
    if (glow){ pc.globalAlpha = p.a * .16; pc.fillRect(p.x - p.r, p.y - p.r, p.r * 3, p.r * 3); }
  }
  // sóng xung kích
  for (const s of shocks){
    s.r += s.sp * (1 - s.r / s.max * .6); s.a = Math.max(0, 1 - s.r / s.max);
    pc.globalAlpha = s.a * .8; pc.strokeStyle = s.col; pc.lineWidth = 2 + s.a * 5;
    pc.beginPath(); pc.arc(s.x, s.y, s.r, 0, 6.283); pc.stroke();
    pc.globalAlpha = s.a * .25; pc.lineWidth = 14 * s.a;
    pc.beginPath(); pc.arc(s.x, s.y, s.r * .92, 0, 6.283); pc.stroke();
  }
  shocks = shocks.filter(s => s.a > .01);
  pc.globalAlpha = 1; pc.globalCompositeOperation = 'source-over';
  parts = parts.filter(p => !(p.dying && p.a <= 0));
}

function frame3(t){
  if (!on3) return;
  const k = Math.min(1, (t - t0) / 3200), ease = easeOutBack(k);
  if (!drag) theta += .0018;
  const e2 = 1 - Math.pow(1 - Math.min(1, (t - t0) / 6000), 3), ph = Math.min(1.4, phi + (1 - e2) * .9), th = theta + (1 - e2) * 1.6, d = dist * (1.6 - .6 * e2);
  // warp: FOV rộng lúc đầu rồi thu lại + rung nhẹ khi vào cảnh
  camPunch += (0 - camPunch) * .05; shake *= .93;
  const fov = 55 + (1 - e2) * 48 + camPunch * 6;
  if (Math.abs(cam.fov - fov) > .01){ cam.fov = fov; cam.updateProjectionMatrix(); }
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  cam.position.set(Math.sin(th) * Math.cos(ph) * d + sx, 4 + Math.sin(ph) * d + sy, Math.cos(th) * Math.cos(ph) * d);
  cam.lookAt(0, 4, 0);
  heartGroup.rotation.y = t / 2500; heartGroup.position.y = 7 + Math.sin(t / 900) * .3;
  heartGroup.scale.setScalar(Math.max(0, ease) * (1 + .05 * Math.sin(t / 240)));
  const gs = .35 + .65 * e2; galaxy.scale.setScalar(gs); labels.scale.setScalar(gs); photos.scale.setScalar(gs);
  galaxy.rotation.y -= .0025 + (1 - e2) * .05; labels.rotation.y += .0012 + (1 - e2) * .02; photos.rotation.y -= .0016 + (1 - e2) * .02; sparkU.value = t / 1000;
  galaxy.userData.rings.forEach((m, i) => { m.rotation.z += i ? -.012 : .02; m.material.color.setHSL(.94, 1, .65 + .3 * Math.sin(t / 600 + i * 2)); });
  photos.children.forEach(pv => pv.children[0].lookAt(cam.position));
  const rp = rise.geometry.attributes.position, rph = rise.geometry.attributes.ph;
  for (let i = 0; i < rp.count; i++){ let y = rp.getY(i) + .008 + rph.getX(i) * .02; if (y > 18) y = 0; rp.setY(i, y); } rp.needsUpdate = true;

    m.a += m.v * .01; m.s.position.set(Math.cos(m.a) * m.r, m.h + Math.sin(t / 700 + m.p) * .4, Math.sin(m.a) * m.r);

}

  parts.forEach(p => { if (!p.dying){ p.delay = 0; p.burst = false; p.tx = W / 2; p.ty = H * .42; p.e = .07 + Math.random() * .05; } });
  // 2) nổ sáng + sóng xung kích
  setTimeout(() => { shockwave(W / 2, H * .42, '#ffffff', Math.max(W, H) * .9, 22); shockwave(W / 2, H * .42, '#ff7aa8', Math.max(W, H) * .7, 15); flash(1, 1800); }, 650);
  setTimeout(() => parts.forEach(p => { p.dying = true; p.burst = false; p.fade = .05; p.tx = p.x; p.ty = p.y; p.e = 0; }), 800);
  // 3) cảnh 3D xuất hiện từ trong ánh sáng, bay vào kiểu warp
  setTimeout(() => {
    rain.style.opacity = 0; t0 = performance.now(); on3 = true; shake = 1.2; camPunch = 1;
    c3.style.transition = 'none'; c3.style.filter = 'blur(16px) brightness(3)'; c3.style.opacity = 1; void c3.offsetWidth;
    c3.style.transition = 'opacity 1.2s, filter 3.2s cubic-bezier(.2,.7,.2,1)'; c3.style.filter = 'none';
    document.body.classList.add('done');
  }, 700);
  setTimeout(() => { shake = Math.max(shake, .5); flash(.35, 900); }, 1700);   // nhịp tim đầu tiên
}

function loop(t){ rainFrame(); fxFrame(); frame3(t); requestAnimationFrame(loop); }
requestAnimationFrame(loop);


function waitAccept(ok){
  return new Promise(resolve => {
    const box = document.getElementById('accept'), btn = document.getElementById('yes'), bar = btn.querySelector('.bar');
    btn.classList.remove('loading', 'go'); box.classList.remove('fade'); bar.style.strokeDashoffset = 502; document.getElementById('pctN').textContent = 0;
    void box.offsetWidth; box.classList.add('on');
    const onClick = async () => {
      btn.removeEventListener('click', onClick);
      const id = running;
      btn.classList.add('loading'); flash(.25, 800);
      const dur = 3400, start = performance.now();
      while (true){
        const k = Math.min(1, (performance.now() - start) / dur), e = k * k * (3 - 2 * k);
        bar.style.strokeDashoffset = 502 * (1 - e); document.getElementById('pctN').textContent = Math.round(e * 100);                  // vòng tròn chạy quanh nút
        rainBoost = 3 + k * 4;
        parts.forEach(p => { if (!p.dying){ p.tx += (W / 2 - p.tx) * .012 * (1 + k * 2); p.ty += (H * .42 - p.ty) * .012 * (1 + k * 2); } });
        if (k >= 1 || id !== running) break;
        await sleep(30);
      }
      if (id !== running) return resolve();
      // nút tròn phóng to lấp đầy màn hình → sáng lóe → trái tim 3D
      box.classList.add('fade'); btn.classList.add('go'); flash(.9, 1400);
      await sleep(900);
      box.classList.remove('on');
      resolve();
    };
    btn.addEventListener('click', onClick);
  });
}

async function play(){
  const id = ++running, ok = () => id === running;
  on3 = false; c3.style.opacity = 0; c3.style.filter = 'none';
  document.body.classList.add('cine'); document.body.classList.remove('done');
  killStyle = 'burst'; spawnStyle = 0;
  parts.forEach(p => { if (!p.dying) kill(p); });
  document.getElementById('finale').classList.remove('on');
  { const a = document.getElementById('accept'); a.classList.remove('on', 'fade'); }
  await sleep(1800); if (!ok()) return;
  rain.style.opacity = .6;
  const styles = ['burst', 'vortex', 'burst', 'fall'];
  for (let i = 0; i < CONFIG.steps.length; i++){
    const s = CONFIG.steps[i], last = i === CONFIG.steps.length - 1;
    setTargets(textPoints(s.lines, s.color));
    shockwave(W / 2, H / 2, s.color || '#5fa8ff', Math.max(W, H) * .55, 11);
    if (s.color) flash(.18, 900);
    await sleep(s.hold); if (!ok()) return;
    if (!last){ killStyle = styles[i % styles.length]; scatter(); rainBoost = 3.5; await sleep(900); if (!ok()) return; }
  }
  // nút "Em đồng ý": hiện ra, chờ bấm, chạy loading rồi chuyển cảnh sang trái tim
  await waitAccept(ok); if (!ok()) return;
  show3D();
  document.getElementById('fin').textContent = CONFIG.finale || '';
  await sleep(2000); if (!ok()) return;
  document.getElementById('finale').classList.add('on');
}

let opened = false;
document.getElementById('go').addEventListener('click', () => {
  if (opened) return; opened = true;
  document.getElementById('bgm').play().catch(() => {});
  const s = document.getElementById('start'); s.classList.add('opening');
  if (window.introExplode) introExplode();
  flash(.55, 1300); rainBoost = 5;
  setTimeout(() => { s.classList.add('leaving'); setTimeout(() => s.remove(), 1300); play(); }, 950);
});
document.getElementById('again').addEventListener('click', () => {
  const a = document.getElementById('bgm'); a.currentTime = 0; a.play().catch(() => {});
  rain.style.opacity = 1; rainBoost = 5; flash(.4, 1200); shockwave(W / 2, H / 2, '#5fa8ff', Math.max(W, H) * .8, 18); play();
});
</script>
